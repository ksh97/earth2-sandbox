openapi: 3.1.0
info:
  title: earth2-sandbox
  description: Backend API for the Earth-2 weather forecast sandbox.
  version: 0.1.0
paths:
  /:
    get:
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - additionalProperties:
                      type: string
                    type: object
                type: object
                title: Response Index  Get
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: boolean
                type: object
                title: Response Health Health Get
  /api/v1/forecast/provider/status:
    get:
      tags:
      - forecast
      summary: Forecast Provider Status
      operationId: forecast_provider_status_api_v1_forecast_provider_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastProviderStatus'
  /api/v1/forecast/point:
    get:
      tags:
      - forecast
      summary: Point Forecast
      operationId: point_forecast_api_v1_forecast_point_get
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Latitude
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Longitude
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/sample:
    get:
      tags:
      - forecast
      summary: Sample Forecast
      operationId: sample_forecast_api_v1_forecast_sample_get
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Latitude
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Longitude
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/fourcastnet/hosted/infer:
    post:
      tags:
      - forecast
      summary: Hosted Fourcastnet Inference
      operationId: hosted_fourcastnet_inference_api_v1_forecast_fourcastnet_hosted_infer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FourCastNetHostedInferenceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FourCastNetHostedInferenceResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs:
    post:
      tags:
      - forecast-jobs
      summary: Create Forecast Job
      operationId: create_forecast_job_api_v1_forecast_jobs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastJobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - forecast-jobs
      summary: List Forecast Jobs
      operationId: list_forecast_jobs_api_v1_forecast_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs/cleanup:
    post:
      tags:
      - forecast-jobs
      summary: Cleanup Forecast Jobs
      operationId: cleanup_forecast_jobs_api_v1_forecast_jobs_cleanup_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ForecastJobCleanupRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJobCleanupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs/{job_id}:
    get:
      tags:
      - forecast-jobs
      summary: Get Forecast Job
      operationId: get_forecast_job_api_v1_forecast_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs/{job_id}/poll:
    get:
      tags:
      - forecast-jobs
      summary: Poll Forecast Job
      operationId: poll_forecast_job_api_v1_forecast_jobs__job_id__poll_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJobPollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs/{job_id}/cancel:
    post:
      tags:
      - forecast-jobs
      summary: Cancel Forecast Job
      operationId: cancel_forecast_job_api_v1_forecast_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forecast/jobs/{job_id}/retry:
    post:
      tags:
      - forecast-jobs
      summary: Retry Forecast Job
      operationId: retry_forecast_job_api_v1_forecast_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ForecastJob:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        parent_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Job Id
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
          default: 1
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        forecast:
          anyOf:
          - $ref: '#/components/schemas/ForecastSummary'
          - type: 'null'
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/ForecastJobDiagnostics'
          - type: 'null'
        events:
          items:
            $ref: '#/components/schemas/ForecastJobEvent'
          type: array
          title: Events
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        links:
          additionalProperties:
            type: string
          type: object
          title: Links
      type: object
      required:
      - id
      - status
      - latitude
      - longitude
      - created_at
      - updated_at
      title: ForecastJob
    ForecastJobCleanupRequest:
      properties:
        older_than_hours:
          type: integer
          maximum: 8760.0
          minimum: 1.0
          title: Older Than Hours
          default: 168
        statuses:
          items:
            type: string
            enum:
            - succeeded
            - failed
            - cancelled
          type: array
          title: Statuses
      type: object
      title: ForecastJobCleanupRequest
    ForecastJobCleanupResponse:
      properties:
        deleted_count:
          type: integer
          title: Deleted Count
        cutoff:
          type: string
          format: date-time
          title: Cutoff
        statuses:
          items:
            type: string
            enum:
            - succeeded
            - failed
            - cancelled
          type: array
          title: Statuses
      type: object
      required:
      - deleted_count
      - cutoff
      - statuses
      title: ForecastJobCleanupResponse
    ForecastJobCreateRequest:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
      type: object
      required:
      - latitude
      - longitude
      title: ForecastJobCreateRequest
    ForecastJobDiagnostics:
      properties:
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        response_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Source
        cache_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Cache Status
        cached_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Cached Artifact Id
        nvcf_request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Nvcf Request Id
        nvcf_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Nvcf Status
        poll_attempts:
          type: integer
          title: Poll Attempts
          default: 0
        response_reference_present:
          type: boolean
          title: Response Reference Present
          default: false
        byte_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Byte Length
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      title: ForecastJobDiagnostics
    ForecastJobEvent:
      properties:
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
        message:
          type: string
          title: Message
      type: object
      required:
      - occurred_at
      - status
      - message
      title: ForecastJobEvent
    ForecastJobListResponse:
      properties:
        count:
          type: integer
          title: Count
        jobs:
          items:
            $ref: '#/components/schemas/ForecastJobSummary'
          type: array
          title: Jobs
      type: object
      required:
      - count
      - jobs
      title: ForecastJobListResponse
    ForecastJobPollResponse:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
        terminal:
          type: boolean
          title: Terminal
        forecast_ready:
          type: boolean
          title: Forecast Ready
        updated_at:
          type: string
          format: date-time
          title: Updated At
        retry_after_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After Seconds
        event_count:
          type: integer
          title: Event Count
        latest_event:
          anyOf:
          - $ref: '#/components/schemas/ForecastJobEvent'
          - type: 'null'
        links:
          additionalProperties:
            type: string
          type: object
          title: Links
      type: object
      required:
      - id
      - status
      - terminal
      - forecast_ready
      - updated_at
      - event_count
      title: ForecastJobPollResponse
    ForecastJobSummary:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        parent_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Job Id
        attempt:
          type: integer
          minimum: 1.0
          title: Attempt
          default: 1
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/ForecastJobDiagnostics'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        links:
          additionalProperties:
            type: string
          type: object
          title: Links
      type: object
      required:
      - id
      - status
      - latitude
      - longitude
      - created_at
      - updated_at
      title: ForecastJobSummary
    ForecastMetric:
      properties:
        name:
          type: string
          title: Name
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
      type: object
      required:
      - name
      - value
      - unit
      title: ForecastMetric
    ForecastModelInfo:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        resolution:
          type: string
          title: Resolution
        run_mode:
          type: string
          enum:
          - mock
          - nim
          title: Run Mode
      type: object
      required:
      - name
      - version
      - resolution
      - run_mode
      title: ForecastModelInfo
    ForecastProviderStatus:
      properties:
        provider:
          type: string
          enum:
          - mock
          - fourcastnet
          title: Provider
        mode:
          type: string
          title: Mode
        configured:
          type: boolean
          title: Configured
        ready:
          type: boolean
          title: Ready
        supports_point_forecast:
          type: boolean
          title: Supports Point Forecast
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
        detail:
          type: string
          title: Detail
      type: object
      required:
      - provider
      - mode
      - configured
      - ready
      - supports_point_forecast
      - detail
      title: ForecastProviderStatus
    ForecastSignal:
      properties:
        name:
          type: string
          title: Name
        level:
          type: string
          enum:
          - low
          - moderate
          - elevated
          title: Level
        message:
          type: string
          title: Message
      type: object
      required:
      - name
      - level
      - message
      title: ForecastSignal
    ForecastSummary:
      properties:
        provider:
          type: string
          enum:
          - mock
          - fourcastnet
          title: Provider
        generated_at:
          type: string
          format: date-time
          title: Generated At
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        headline:
          type: string
          title: Headline
        metrics:
          items:
            $ref: '#/components/schemas/ForecastMetric'
          type: array
          title: Metrics
        model:
          $ref: '#/components/schemas/ForecastModelInfo'
        forecast_window:
          $ref: '#/components/schemas/ForecastWindow'
        timeline:
          items:
            $ref: '#/components/schemas/ForecastTimelineStep'
          type: array
          title: Timeline
        signals:
          items:
            $ref: '#/components/schemas/ForecastSignal'
          type: array
          title: Signals
      type: object
      required:
      - provider
      - generated_at
      - latitude
      - longitude
      - headline
      - metrics
      - model
      - forecast_window
      - timeline
      - signals
      title: ForecastSummary
    ForecastTimelineStep:
      properties:
        lead_time_hours:
          type: integer
          minimum: 0.0
          title: Lead Time Hours
        valid_at:
          type: string
          format: date-time
          title: Valid At
        temperature_c:
          type: number
          title: Temperature C
        wind_speed_ms:
          type: number
          title: Wind Speed Ms
        humidity_percent:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Humidity Percent
        precipitation_probability_percent:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Precipitation Probability Percent
        pressure_hpa:
          type: number
          title: Pressure Hpa
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        condition:
          type: string
          enum:
          - clear
          - breezy
          - humid
          - rain_watch
          title: Condition
        summary:
          type: string
          title: Summary
      type: object
      required:
      - lead_time_hours
      - valid_at
      - temperature_c
      - wind_speed_ms
      - humidity_percent
      - precipitation_probability_percent
      - pressure_hpa
      - confidence
      - condition
      - summary
      title: ForecastTimelineStep
    ForecastWindow:
      properties:
        start_at:
          type: string
          format: date-time
          title: Start At
        end_at:
          type: string
          format: date-time
          title: End At
        step_hours:
          type: integer
          title: Step Hours
        lead_hours:
          items:
            type: integer
          type: array
          title: Lead Hours
      type: object
      required:
      - start_at
      - end_at
      - step_hours
      - lead_hours
      title: ForecastWindow
    FourCastNetDecodedArray:
      properties:
        filename:
          type: string
          title: Filename
        lead_time_hours:
          type: integer
          title: Lead Time Hours
        batch_index:
          type: integer
          title: Batch Index
        shape:
          items:
            type: integer
          type: array
          title: Shape
        dtype:
          type: string
          title: Dtype
        finite_count:
          type: integer
          title: Finite Count
        min_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Value
        mean_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Mean Value
      type: object
      required:
      - filename
      - lead_time_hours
      - batch_index
      - shape
      - dtype
      - finite_count
      - min_value
      - max_value
      - mean_value
      title: FourCastNetDecodedArray
    FourCastNetDecodedTarSummary:
      properties:
        member_count:
          type: integer
          title: Member Count
        arrays:
          items:
            $ref: '#/components/schemas/FourCastNetDecodedArray'
          type: array
          title: Arrays
        lead_time_hours:
          items:
            type: integer
          type: array
          title: Lead Time Hours
        batch_indices:
          items:
            type: integer
          type: array
          title: Batch Indices
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - member_count
      - arrays
      - lead_time_hours
      - batch_indices
      - warnings
      title: FourCastNetDecodedTarSummary
    FourCastNetHostedInferenceRequest:
      properties:
        input_id:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Input Id
          default: 0
        variables:
          items:
            type: string
            enum:
            - w10m
            - t2m
            - msl
            - tcwv
            - z500
          type: array
          title: Variables
        simulation_length:
          type: integer
          maximum: 40.0
          minimum: 1.0
          title: Simulation Length
          default: 4
        ensemble_size:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Ensemble Size
          default: 1
        noise_amplitude:
          type: number
          maximum: 0.1
          minimum: 0.0
          title: Noise Amplitude
          default: 0
        accept:
          type: string
          enum:
          - application/json
          - application/x-tar
          title: Accept
          default: application/x-tar
        poll_seconds:
          type: integer
          maximum: 120.0
          minimum: 1.0
          title: Poll Seconds
          default: 5
      type: object
      title: FourCastNetHostedInferenceRequest
    FourCastNetHostedInferenceResult:
      properties:
        endpoint:
          type: string
          title: Endpoint
        status_code:
          type: integer
          title: Status Code
        content_type:
          type: string
          title: Content Type
        byte_length:
          type: integer
          title: Byte Length
        sha256:
          type: string
          title: Sha256
        request_payload:
          additionalProperties:
            anyOf:
            - type: integer
            - type: number
            - type: string
          type: object
          title: Request Payload
        json_preview:
          anyOf:
          - {}
          - type: 'null'
          title: Json Preview
        decoded_tar:
          anyOf:
          - $ref: '#/components/schemas/FourCastNetDecodedTarSummary'
          - type: 'null'
        post_processing:
          anyOf:
          - $ref: '#/components/schemas/FourCastNetPostProcessingReport'
          - type: 'null'
        nvcf_request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Nvcf Request Id
        nvcf_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Nvcf Status
        large_asset_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Large Asset Message
        poll_attempts:
          type: integer
